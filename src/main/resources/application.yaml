server:
  port: 8084

spring:
  application:
    name: property-service

  profiles:
    active: local

feign:
  client:
    config:
      default:
        logger-level: FULL

logging:
  level:
    root: INFO
    com.stayease.property_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    com.stayease.property_service.config.OwnerClient: DEBUG
    com.stayease.property_service.config.UserClient: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/stayease_property_db
    username: root
    password: 2000030757
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

services:
  owner:
    url: http://localhost:8083
  user:
    url: http://localhost:8082

